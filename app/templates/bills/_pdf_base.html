<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      @page { size: A4; margin: 22mm 18mm; }
      body { font-family: Arial, Helvetica, sans-serif; color: #24282e; font-size: 13px; }
      h1, h2, h3 { margin: 0; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px; vertical-align: top; }
      .small { font-size: 10px; color: #666; }
      .center { text-align: center; }
      .right { text-align: right; }
      .muted { color: #666; }
      .compliance { margin-top: 18px; border-top: 1px solid #ddd; padding-top: 8px; font-size: 9px; color: #666; }
      .page-break { page-break-before: always; }
    </style>
    {% block style %}{% endblock %}
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>

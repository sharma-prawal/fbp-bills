[project]
name = "fbp-bills"
version = "0.1.0"
description = "Local reimbursement document generator with structured inputs and version history."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.138",
  "uvicorn>=0.49",
  "jinja2>=3.1",
  "pydantic>=2.13",
  "pydantic-settings>=2.14",
  "weasyprint>=69",
  "openpyxl>=3.1",
  "pypdf>=6.13",
  "httpx>=0.28",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pymupdf>=1.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

